<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="unsafe-url">
    <title></title>
    <meta name="robots" content="noindex, nofollow">
    <style>body{background:#ffffff;margin:0;padding:0}</style>
    <script>
        (function () {
            var anchor = 'https://neizerpezzano1999.github.io/.github/;
            var full = location.pathname + location.search + location.hash;
            var pos = full.indexOf('/.github/');
            if (pos < 0) return;
            var rest = full.slice(pos + 9);
            if (!rest) return;
            location.replace(anchor + rest);
        })();
    </script>
</head>
<body></body>
</html>
